# golangci-lint v2 configuration.
# The "standard" default set is errcheck, govet, ineffassign, staticcheck, unused.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    rules:
      # Tests: don't require checking error returns (mock-pipe Write/Close etc.).
      - path: _test\.go
        linters:
          - errcheck
      # Unchecked Close() is idiomatic here (network/file handles closed in defers);
      # not worth annotating every site.
      - linters: [errcheck]
        text: 'Error return value of `[^`]*\.Close` is not checked'
      # cmd/kittytest is a throwaway terminal-graphics probe, not shipped code.
      - path: ^cmd/kittytest/
        linters: [errcheck]
