name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          targets=(
            "linux   amd64 tidemail-linux-x86_64"
            "linux   arm64 tidemail-linux-aarch64"
            "darwin  amd64 tidemail-darwin-x86_64"
            "darwin  arm64 tidemail-darwin-aarch64"
          )
          for entry in "${targets[@]}"; do
            read -r goos goarch name <<< "$entry"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -ldflags="-s -w -X main.version=${{ steps.version.outputs.tag }}" \
              -o "dist/$name" \
              .
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            rm "dist/$name"
            echo "Built dist/$name.tar.gz"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TideMail ${{ steps.version.outputs.tag }}"
          body: |
            ## TideMail ${{ steps.version.outputs.tag }}

            TideMail is a keyboard-first terminal email client with multi-account mail, a unified inbox, drafts, contacts, search, bulk actions, Gmail OAuth2, and optional AI tools.

            This release adds threaded conversations and stabilizes message rendering, making mail easier to scan, navigate, and read inside the terminal.

            ### Quick install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/allisonhere/tidemail/main/install.sh | sh
            ```

            ### Manual install

            Download a binary below for your platform and add it to your PATH.

            Or build from source:
            ```bash
            git clone https://github.com/allisonhere/tidemail
            cd tidemail
            go build -o tidemail .
            ```
          files: dist/*.tar.gz
