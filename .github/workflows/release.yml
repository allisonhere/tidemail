name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          targets=(
            "linux   amd64 tidemail-linux-x86_64"
            "linux   arm64 tidemail-linux-aarch64"
            "darwin  amd64 tidemail-darwin-x86_64"
            "darwin  arm64 tidemail-darwin-aarch64"
          )
          for entry in "${targets[@]}"; do
            read -r goos goarch name <<< "$entry"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -ldflags="-s -w -X main.version=${{ steps.version.outputs.tag }}" \
              -o "dist/$name" \
              .
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            rm "dist/$name"
            echo "Built dist/$name.tar.gz"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TideMail ${{ steps.version.outputs.tag }}"
          body: |
            ## TideMail ${{ steps.version.outputs.tag }}

            TideMail is a keyboard-first terminal email client with multi-account mail, a unified inbox, drafts, contacts, search, bulk actions, and optional AI tools.

            ### Highlights
            A new, owned compose editor replaces the stock textarea for the message body — bringing real text editing to compose:
            - Text selection (`shift`+arrows / `ctrl+shift`+arrows) and select-all (`ctrl+a`)
            - Undo / redo (`ctrl+z` / `ctrl+y`)
            - Copy / cut / paste (`ctrl+c` / `ctrl+x` / `ctrl+v`) via the system clipboard
            - Word movement (`ctrl`+arrows) and smooth soft-wrap

            ### Changed
            - **Sign in with an App Password — OAuth removed.** Google accounts authenticate with an app password (enable 2-Step Verification → myaccount.google.com/apppasswords), ending the ~7-day OAuth re-authentication. If you used "Sign in with Google", edit your Gmail account in the Account Manager (`M`) and paste an app password.
            - Attach file moved to `alt+f` (freeing `ctrl+a` for select-all).

            ### Fixed
            - Compose body no longer spills onto the left edge when replying.
            - Up/down arrow navigation tracks wrapped lines correctly.
            - Cut (`ctrl+x`) copies to the clipboard instead of just deleting.
            - BCC edits are included in compose autosave.

            ### Quick install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/allisonhere/tidemail/main/install.sh | sh
            ```

            ### Manual install

            Download a binary below for your platform and add it to your PATH.

            Or build from source:
            ```bash
            git clone https://github.com/allisonhere/tidemail
            cd tidemail
            go build -o tidemail .
            ```
          files: dist/*.tar.gz
