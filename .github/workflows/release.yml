name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          targets=(
            "linux   amd64 tidemail-linux-x86_64"
            "linux   arm64 tidemail-linux-aarch64"
            "darwin  amd64 tidemail-darwin-x86_64"
            "darwin  arm64 tidemail-darwin-aarch64"
          )
          for entry in "${targets[@]}"; do
            read -r goos goarch name <<< "$entry"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -ldflags="-s -w -X main.version=${{ steps.version.outputs.tag }}" \
              -o "dist/$name" \
              .
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            rm "dist/$name"
            echo "Built dist/$name.tar.gz"
          done
          # Checksums for in-app self-update integrity verification. The updater
          # refuses to install an archive whose SHA-256 isn't listed here.
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS )
          echo "----- SHA256SUMS -----"
          cat dist/SHA256SUMS

      - name: Extract release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## TideMail $TAG"
            echo
            echo "TideMail is a keyboard-first terminal email client with multi-account mail, a unified inbox, drafts, contacts, search, bulk actions, and optional AI tools."
            echo
            # Pull the section for this tag out of CHANGELOG.md (between "## $TAG"
            # and the next "## " heading) so release notes never drift from it.
            awk -v ver="## $TAG" '
              $0 == ver { flag = 1; next }
              /^## / && flag { flag = 0 }
              flag { print }
            ' CHANGELOG.md
          } > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TideMail ${{ steps.version.outputs.tag }}"
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
