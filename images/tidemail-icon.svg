<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Tidemail icon</title>
  <desc id="desc">A layered blue ocean wave curling around a white envelope on a transparent background.</desc>

  <defs>
    <linearGradient id="waveTop" x1="0.08" y1="0.04" x2="0.88" y2="0.94">
      <stop offset="0" stop-color="#68cfff"/>
      <stop offset=".28" stop-color="#2f9df4"/>
      <stop offset=".62" stop-color="#1476dc"/>
      <stop offset="1" stop-color="#0b49b9"/>
    </linearGradient>

    <linearGradient id="waveInner" x1="0.18" y1="0.12" x2="0.83" y2="0.86">
      <stop offset="0" stop-color="#2394ef"/>
      <stop offset=".46" stop-color="#0d63cf"/>
      <stop offset="1" stop-color="#073a9d"/>
    </linearGradient>

    <linearGradient id="waveLower" x1="0.07" y1="0.1" x2="0.9" y2="0.92">
      <stop offset="0" stop-color="#228ce8"/>
      <stop offset=".55" stop-color="#0b5cc7"/>
      <stop offset="1" stop-color="#082c80"/>
    </linearGradient>

    <linearGradient id="waveDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4db1"/>
      <stop offset=".58" stop-color="#062d79"/>
      <stop offset="1" stop-color="#031a52"/>
    </linearGradient>

    <linearGradient id="envFace" x1="0.05" y1="0.05" x2="0.95" y2="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#d8eaff"/>
    </linearGradient>

    <linearGradient id="envSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f3ff"/>
      <stop offset="1" stop-color="#b6d8fb"/>
    </linearGradient>

    <linearGradient id="envFlap" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5f1ff"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#003c86" flood-opacity=".24"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- main curling wave -->
  <path d="M118 765
           L118 478
           C118 285 263 137 475 110
           C648 88 802 158 930 286
           C954 310 944 331 909 328
           C835 323 777 285 700 276
           C608 266 531 295 467 350
           C418 393 383 444 370 503
           C352 585 372 655 429 703
           C479 745 550 755 626 730
           C706 704 772 689 847 708
           C912 725 959 762 982 813
           C1003 860 978 910 934 940
           C874 981 804 989 742 967
           C680 945 629 904 575 878
           C511 847 449 844 380 865
           C306 887 240 893 187 861
           C143 835 118 802 118 765 Z"
        fill="url(#waveTop)" filter="url(#shadow)"/>

  <!-- inner curl -->
  <path d="M201 736
           L201 486
           C201 349 302 240 452 213
           C574 191 682 220 777 282
           C708 267 647 268 593 286
           C499 318 433 381 405 468
           C377 555 393 639 452 692
           C507 741 585 754 663 727
           C724 706 773 701 823 713
           C769 735 717 759 665 787
           C593 826 526 840 451 829
           C351 814 270 781 201 736 Z"
        fill="url(#waveInner)"/>

  <!-- lower wave layer -->
  <path d="M118 727
           C235 791 337 811 440 790
           C536 770 614 714 707 716
           C810 718 898 769 982 847
           L982 898
           C920 952 846 970 772 951
           C695 931 641 882 575 852
           C508 821 445 817 377 838
           C297 863 232 859 178 827
           C140 805 118 770 118 727 Z"
        fill="url(#waveLower)"/>

  <!-- deepest base -->
  <path d="M135 824
           C232 887 344 906 444 875
           C539 846 616 829 704 854
           C792 879 853 939 904 982
           L217 982
           C171 947 142 895 135 824 Z"
        fill="url(#waveDeep)"/>

  <!-- envelope -->
  <g filter="url(#shadow)">
    <rect x="330" y="430" width="590" height="340" rx="52" fill="url(#envFace)"/>
    <path d="M342 458
             L574 655
             C609 685 642 685 677 655
             L908 458
             C897 440 879 430 855 430
             H395
             C371 430 353 440 342 458 Z"
          fill="url(#envFlap)"/>
    <path d="M344 725
             L527 565
             L574 605
             C609 635 642 635 677 605
             L724 565
             L908 725
             C899 752 878 770 849 770
             H403
             C374 770 353 752 344 725 Z"
          fill="url(#envSide)"/>
    <path d="M342 459 L574 655 C609 685 642 685 677 655 L908 459"
          fill="none" stroke="#79baf1" stroke-width="18" stroke-linejoin="round"/>
    <path d="M344 725 L527 565" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
    <path d="M724 565 L908 725" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- small highlight on wave -->
  <path d="M133 468
           C147 294 278 159 468 130
           C625 106 769 161 886 270"
        fill="none" stroke="#9ee2ff" stroke-width="18"
        stroke-linecap="round" stroke-opacity=".42"/>
</svg>
